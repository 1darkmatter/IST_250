<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">

 <title>Portfolio Coming Soon</title>

 <meta
 name="description"
 content="David Magnabosco's web development portfolio is coming soon.">

 <link
 rel="preconnect"
 href="https://fonts.googleapis.com">

 <link
 rel="preconnect"
 href="https://fonts.gstatic.com"
 crossorigin>

 <link
 href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap"
 rel="stylesheet">

 <link
 href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
 rel="stylesheet">

 <style>
 body {
 margin: 0;
 background: #050505;
 color: #cccccc;
 font-family: "Montserrat", sans-serif;
 }

 header,
 footer {
 background: #0b0b0b;
 }

 main {
 min-height: 75vh;
 display: flex;
 align-items: center;
 padding: 40px 20px;
 }

 .coming-soon {
 display: grid;
 grid-template-columns: 1fr 1fr;
 gap: 30px;
 align-items: center;
 max-width: 1000px;
 margin: auto;
 }

 .coming-soon img {
 width: 100%;
 border: 1px solid #333333;
 }

 h1 {
 color: white;
 font-size: 3.5rem;
 }

 .label {
 color: #316cf4;
 font-size: 0.8rem;
 font-weight: 600;
 text-transform: uppercase;
 }

 @media screen and (max-width: 700px) {
 .coming-soon {
 grid-template-columns: 1fr;
 }

 h1 {
 font-size: 2.5rem;
 }
 }
 </style>
</head>

<body>

 <header class="border-bottom">
 <div class="container py-3">
 <a href="index.html">
 <img
 src="assets/img/brand-logo/logo-ko.svg"
 alt="Magnabos.co Logo"
 width="150">
 </a>
 </div>
 </header>

 <main>
 <div class="coming-soon">

 <div>
 <p class="label">
 Web Development Portfolio
 </p>

 <h1>
 Coming Soon
 </h1>

 <p>
 I am building a portfolio featuring my web
 development projects, design work, and creative
 technology experiments.
 </p>

 <p>
 New work will be added soon.
 </p>

 <a
 class="btn btn-primary"
 href="mailto:hello@magnabos.co">
 Contact Me
 </a>
 </div>

 <div>
 <img
 src="assets/img/portfolio-preview.jpg"
 alt="Preview of upcoming web development portfolio">
 </div>

 </div>
 </main>

 <footer class="border-top">
 <div class="container py-4 text-center">
 <p class="small text-body-secondary mb-0">
 &copy;
 <span id="year"></span>
 Magnabos.co, LLC.
 </p>
 </div>
 </footer>

 <script>
 document.getElementById("year").textContent =
 new Date().getFullYear();
 </script>

</body>
</html>
